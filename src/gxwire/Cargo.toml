[package]
name = "gxwire"
version = "0.1.0"
edition = "2024"
authors = ["Genexus18MCP Team"]
description = "High-performance architectural discovery, call graph, and impact engine for GeneXus"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
rayon = "1.10"
bincode = "1.3"
walkdir = "2.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
