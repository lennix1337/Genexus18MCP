[package]
name = "gxwire"
version = "0.1.0"
edition = "2024"
authors = ["Genexus18MCP Team"]
description = "High-performance architectural discovery, call graph, and impact engine for GeneXus"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
regex = "1.10"
rayon = "1.10"
bincode = "1.3"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
