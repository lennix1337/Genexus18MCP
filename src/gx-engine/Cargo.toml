[package]
name = "gx-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Experimental independent portable GeneXus-style compiler and native build driver"

[dependencies]
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
sha2 = "0.11.1"
# Only with the `tds` feature (see `src/udm/tds`). The default build compiles none of these.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "winauth", "sql-browser-tokio"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

[features]
# Native TDS read transport for live Knowledge Base reads (`GXMCP_ENGINE_SQL_TRANSPORT=tds`).
# Off by default: the default binary keeps reading through `sqlcmd` and has no async runtime,
# TLS or SSPI dependency.
tds = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]

[[bench]]
name = "str_format"
harness = false

[[bench]]
name = "bench_suite"
harness = false

[profile.dev]
# Keep file/line backtraces but drop full debug info; dependencies get none.
# Cuts target/ size substantially for every worktree.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
