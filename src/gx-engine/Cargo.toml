[package]
name = "gx-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Experimental independent portable GeneXus-style compiler and native build driver"

[dependencies]
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
sha2 = "0.11.1"

[[bench]]
name = "str_format"
harness = false

[[bench]]
name = "bench_suite"
harness = false

[[bench]]
name = "rebuild_reuse"
harness = false

[profile.dev]
# Keep file/line backtraces but drop full debug info; dependencies get none.
# Cuts target/ size substantially for every worktree.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
