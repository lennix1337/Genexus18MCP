name: Live KB Smoke

on:
  workflow_dispatch:
    inputs:
      kb_path:
        description: 'KB folder on the self-hosted Windows runner'
        required: true
        type: string
      fixture_manifest:
        description: 'Verified synthetic fixture manifest path on the runner (no credentials)'
        required: true
        type: string
      majors:
        description: 'Comma-separated catalog majors to validate (default: every supported major)'
        required: false
        default: ''
        type: string
      gx_path_map:
        description: 'Optional semicolon-separated major=absolute-path overrides'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  live:
    # Supported GeneXus SDKs and the configured test KB are proprietary/local resources;
    # ordinary hosted CI must never attempt this job.
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: 10.0.x

      - name: Run live KB matrix gate
        shell: pwsh
        env:
          GXMCP_TEST_KB: ${{ inputs.kb_path }}
          GXMCP_TEST_FIXTURE: ${{ inputs.fixture_manifest }}
          GXMCP_LIVE_MAJORS: ${{ inputs.majors }}
          GXMCP_LIVE_GX_PATH_MAP: ${{ inputs.gx_path_map }}
        run: |
          $matrixArgs = @(
            '-KbPath', $env:GXMCP_TEST_KB,
            '-FixtureManifest', $env:GXMCP_TEST_FIXTURE,
            '-SummaryPath', "$env:RUNNER_TEMP\gxmcp-live-matrix.json",
            '-RequireBuildAll',
            '-RunBenchmark',
            '-Iterations', '100'
          )
          $selectedMajors = @($env:GXMCP_LIVE_MAJORS -split '[,;\s]+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($selectedMajors.Count -gt 0) {
            $matrixArgs += '-Majors'
            $matrixArgs += $selectedMajors
          }
          $pathOverrides = @($env:GXMCP_LIVE_GX_PATH_MAP -split ';' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($pathOverrides.Count -gt 0) {
            $matrixArgs += '-GxPathMap'
            $matrixArgs += $pathOverrides
          }
          & pwsh -NoProfile -File .\scripts\test-live-matrix.ps1 @matrixArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gxmcp-live-benchmark
          path: |
            ${{ runner.temp }}\gxmcp-live-matrix.json
            ${{ runner.temp }}\gxmcp-live-*.json
          if-no-files-found: ignore
