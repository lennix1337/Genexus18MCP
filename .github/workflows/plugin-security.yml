name: HOL Plugin Scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR branches are scanned by pull_request, not again by push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run HOL Plugin Scanner
        id: scanner
        uses: hashgraph-online/ai-plugin-scanner-action@37a0b7035b989c0bcd1177dd7f6c77b49dab7c2f # v1.2.809
        with:
          plugin_dir: .
          mode: scan
          format: json
          output: ${{ runner.temp }}/hol-plugin-scan.json
          config: .plugin-scanner.toml
          min_score: 80
          fail_on_severity: high
          pr_comment: off
          trust_repository_policy: true
          online: false

      - name: Print detailed scanner report
        if: always()
        run: cat "${{ runner.temp }}/hol-plugin-scan.json"

      - name: Upload detailed scanner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hol-plugin-scan-report
          path: ${{ runner.temp }}/hol-plugin-scan.json
          if-no-files-found: warn
