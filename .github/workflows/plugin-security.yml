name: HOL Plugin Scanner

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run HOL Plugin Scanner
        id: scanner
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: .
          mode: scan
          format: json
          output: ${{ runner.temp }}/hol-plugin-scan.json
          min_score: 80
          fail_on_severity: high
          pr_comment: off
          trust_repository_policy: false
          online: false

      - name: Print detailed scanner report
        if: always()
        run: cat "${{ runner.temp }}/hol-plugin-scan.json"

      - name: Upload detailed scanner report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hol-plugin-scan-report
          path: ${{ runner.temp }}/hol-plugin-scan.json
          if-no-files-found: warn
