name: Release

on:
  release:
    # Normal publication is triggered once by the published event. Asset repair
    # for an existing release is explicit through workflow_dispatch.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish (e.g. v2.6.6)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No release tag resolved from event or workflow_dispatch input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve release commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          if [[ -z "$COMMIT" ]]; then
            echo "::error::The release tag did not resolve to a commit."
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Release source commit: $COMMIT"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.16.0
          npm --version

      - name: Resolve package metadata
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.tag }}"
          EXPECTED="v$VERSION"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Release tag $TAG does not match package.json version $EXPECTED."
            exit 1
          fi
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          VSIX="nexus-ide-${VERSION}.vsix"
          CHECKSUM_REQUIRED=false
          VSIX_REQUIRED=false
          MODERN_ASSETS=false
          if [[ "$VERSION" == 3.* ]]; then CHECKSUM_REQUIRED=true; VSIX_REQUIRED=true; MODERN_ASSETS=true; fi
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq -e \
            --arg tag "$TAG" \
            --arg vsix "$VSIX" \
            --arg checksumRequired "$CHECKSUM_REQUIRED" \
            --arg vsixRequired "$VSIX_REQUIRED" \
            --arg modern "$MODERN_ASSETS" '
              def one($name): ([.assets[]? | select(.name == $name)] | length) == 1;
              def has_digest($name): any(.assets[]?;
                .name == $name and
                ((.digest // "") | test("^sha256:[0-9a-fA-F]{64}$")) and
                ((.size // 0) > 0));
              .tag_name == $tag and .draft == false and
              one("publish.zip") and
              (($modern != "true") or has_digest("publish.zip")) and
              (($checksumRequired != "true") or (one("publish.zip.sha256") and has_digest("publish.zip.sha256"))) and
              (($vsixRequired != "true") or (one($vsix) and has_digest($vsix))) and
              all(.assets[]; .state == "uploaded")
            ' <<<"$RELEASE_JSON" >/dev/null

      - name: Check npm registry
        id: npm_check
        shell: bash
        run: |
          set -euo pipefail
          CHECK_STARTED_EPOCH="$(date +%s)"
          OBSERVED_JSON="$(npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version gitHead --json --fetch-retries=0 --fetch-timeout=5000 2>/dev/null || true)"
          OBSERVED_VERSION="$(jq -r 'if type == "array" then .[0].version // empty else .version // empty end' <<<"$OBSERVED_JSON" 2>/dev/null || true)"
          OBSERVED_GIT_HEAD="$(jq -r 'if type == "array" then .[0].gitHead // empty else .gitHead // empty end' <<<"$OBSERVED_JSON" 2>/dev/null || true)"
          CHECK_ELAPSED_SECONDS=$(( $(date +%s) - CHECK_STARTED_EPOCH ))
          if [[ "$OBSERVED_VERSION" == "${{ steps.pkg.outputs.version }}" ]]; then
            if [[ "${{ steps.pkg.outputs.version }}" == 3.* && "$OBSERVED_GIT_HEAD" != "${{ steps.source.outputs.commit }}" ]]; then
              echo "::error::npm version $OBSERVED_VERSION is bound to '$OBSERVED_GIT_HEAD', expected '${{ steps.source.outputs.commit }}'."
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Already on npm; skipping publish (registry check ${CHECK_ELAPSED_SECONDS}s)."
          elif [[ -n "$OBSERVED_VERSION" ]]; then
            echo "::error::npm returned '$OBSERVED_VERSION' for the exact target spec; refusing to skip or publish over a mismatched version."
            exit 1
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Exact npm version is not published yet (registry check ${CHECK_ELAPSED_SECONDS}s)."
          fi

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v2.6.8: spell out the contract so a missing asset gives an actionable
          # message instead of `gh release download`'s cryptic "no assets to
          # download". The asset has to be produced locally (the Worker
          # references Artech.* DLLs from a GeneXus 18 install which the
          # ubuntu runner doesn't have) — release.ps1 automates the full
          # sequence: build → zip → tag → push → gh release create with asset.
          ASSETS="$(gh release view "${{ steps.tag.outputs.tag }}" --json assets --jq '.assets[].name')"
          if ! grep -qx 'publish.zip' <<<"$ASSETS"; then
            echo "::error title=publish.zip missing::Release ${{ steps.tag.outputs.tag }} has no publish.zip asset. Use ./release.ps1 to create releases (builds + zips + uploads in one step), or run 'gh release upload ${{ steps.tag.outputs.tag }} publish.zip' from a machine that has the Worker artefacts."
            exit 1
          fi
          VERSION="${{ steps.pkg.outputs.version }}"
          VSIX="nexus-ide-${VERSION}.vsix"
          if [[ "$VERSION" == 3.* ]] && ! grep -qx 'publish.zip.sha256' <<<"$ASSETS"; then
            echo "::error title=checksum missing::Release ${{ steps.tag.outputs.tag }} must publish publish.zip.sha256 as an asset."
            exit 1
          fi
          if [[ "$VERSION" == 3.* ]] && ! grep -qx "$VSIX" <<<"$ASSETS"; then
            echo "::error title=VSIX missing::Release ${{ steps.tag.outputs.tag }} must publish $VSIX as an asset."
            exit 1
          fi
          gh release download "${{ steps.tag.outputs.tag }}" \
            --pattern publish.zip \
            --dir .
          if [[ "$VERSION" == 3.* ]]; then
            gh release download "${{ steps.tag.outputs.tag }}" \
              --pattern publish.zip.sha256 \
              --dir .
            gh release download "${{ steps.tag.outputs.tag }}" \
              --pattern "$VSIX" \
              --dir .
          fi

      - name: Verify publish.zip integrity
        shell: bash
        run: |
          set -euo pipefail
          # The checksum is a release asset so the source commit remains the
          # exact commit recorded by gxmcp-manifest.json.
          SHA_FILE="publish.zip.sha256"
          if [[ ! -f "$SHA_FILE" ]]; then
            echo "::warning::$SHA_FILE not found for tag ${{ steps.tag.outputs.tag }} — skipping integrity check for a legacy release."
          else
            EXPECTED=$(awk '{print $1}' "$SHA_FILE")
            ACTUAL=$(sha256sum publish.zip | awk '{print $1}')
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::publish.zip SHA-256 mismatch. Expected: $EXPECTED  Got: $ACTUAL"
              echo "::error::The binary was not produced by the tagged commit. Re-run release.ps1 on the correct commit."
              exit 1
            fi
            echo "Integrity check passed: $ACTUAL"
          fi

      - name: Unpack publish/
        run: |
          set -euo pipefail
          mkdir -p publish
          unzip -q publish.zip -d publish
          test -f publish/GxMcp.Gateway.exe || { echo "::error::GxMcp.Gateway.exe missing in publish.zip"; exit 1; }
          test -f publish/worker/GxMcp.Worker.exe || { echo "::error::worker/GxMcp.Worker.exe missing in publish.zip"; exit 1; }
          # Task 4: assert tool_definitions.json is present (version consistency validated by release.ps1)
          test -f publish/tool_definitions.json || { echo "::error::publish/tool_definitions.json missing in publish.zip — rebuild with release.ps1"; exit 1; }
          test -f publish/gxmcp-manifest.json || { echo "::error::gxmcp-manifest.json missing in publish.zip — rebuild with release.ps1"; exit 1; }

      - name: Verify exact release asset bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          VSIX="nexus-ide-${VERSION}.vsix"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.tag.outputs.tag }}")"
          verify_asset() {
            local name="$1"
            local path="$2"
            local require_digest="${3:-true}"
            local count digest size actual local_size
            count="$(jq --arg name "$name" '[.assets[]? | select(.name == $name)] | length' <<<"$RELEASE_JSON")"
            [[ "$count" == "1" ]] || { echo "::error::Expected exactly one $name asset."; exit 1; }
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$RELEASE_JSON")"
            size="$(jq --arg name "$name" -r '.assets[] | select(.name == $name) | .size // 0' <<<"$RELEASE_JSON")"
            if [[ "$require_digest" == "true" ]]; then
              [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::$name has no valid SHA-256 digest."; exit 1; }
              actual="sha256:$(sha256sum "$path" | awk '{print $1}')"
              local_size="$(stat -c '%s' "$path")"
              [[ "$digest" == "$actual" && "$size" == "$local_size" ]] || {
                echo "::error::$name bytes do not match the GitHub asset metadata."
                exit 1
              }
            elif [[ -n "$digest" ]]; then
              [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::$name has an invalid digest."; exit 1; }
            fi
          }
          if [[ "$VERSION" == 3.* ]]; then
            verify_asset publish.zip publish.zip true
            verify_asset publish.zip.sha256 publish.zip.sha256 true
            verify_asset "$VSIX" "$VSIX" true
            cmp --silent "$VSIX" publish/nexus-ide.vsix || {
              echo "::error::$VSIX differs from the VSIX embedded in publish.zip."
              exit 1
            }
          else
            verify_asset publish.zip publish.zip false
          fi

      - name: Verify release manifest artifacts
        shell: bash
        run: |
          set -euo pipefail
          POLICY="$(python -c 'import json; print(json.load(open("publish/gxmcp-manifest.json", encoding="utf-8")).get("sourceCommitPolicy", "legacy"))')"
          if [[ "$POLICY" == "exact-tag" ]]; then
            python scripts/verify-release-manifest.py publish --version "${{ steps.pkg.outputs.version }}" --source-commit "${{ steps.source.outputs.commit }}"
          else
            echo "::warning::Release manifest uses legacy sourceCommit policy; verifying artifact hashes without tag binding."
            python scripts/verify-release-manifest.py publish --version "${{ steps.pkg.outputs.version }}"
          fi

      - name: Verify release metadata parity
        shell: bash
        run: |
          set -euo pipefail
          POLICY="$(python -c 'import json; print(json.load(open("publish/gxmcp-manifest.json", encoding="utf-8")).get("sourceCommitPolicy", "legacy"))')"
          if [[ "$POLICY" == "exact-tag" ]]; then
            python scripts/verify-release-metadata.py --root . --version "${{ steps.pkg.outputs.version }}"
          else
            echo "::warning::Skipping strict package/lockfile parity for a legacy release manifest."
          fi

      - name: Require all v3 plans to be integrated
        run: python scripts/validate-v3-plan.py --require-ready

      - name: Install dependencies
        if: steps.npm_check.outputs.already_published == 'false'
        # --force: package.json declares os=win32 (correct for end users);
        # the linux publish runner only needs devDependencies to run npm publish.
        run: npm install --force --no-audit --no-fund

      - name: Enforce OIDC-only npm auth
        if: steps.npm_check.outputs.already_published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "${NPM_CONFIG_USERCONFIG}" ]]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}" || true
          fi
          OIDC_NPMRC="$RUNNER_TEMP/npmrc-oidc"
          {
            echo "registry=https://registry.npmjs.org/"
          } > "$OIDC_NPMRC"
          echo "NPM_CONFIG_USERCONFIG=$OIDC_NPMRC" >> "$GITHUB_ENV"

      - name: Publish to npm with provenance
        if: steps.npm_check.outputs.already_published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN
          TARGET_SPEC="${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          PUBLISH_STARTED_EPOCH="$(date +%s)"
          PUBLISH_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Publishing ${TARGET_SPEC} to npm with provenance..."
          set +e
          PUBLISH_OUT=$(npm publish --access public --provenance 2>&1)
          PUBLISH_EXIT=$?
          set -e

          echo "$PUBLISH_OUT"

          if [ $PUBLISH_EXIT -eq 0 ]; then
            PUBLISH_OUTCOME="accepted"
            echo "npm publish accepted by registry (staged with provenance)."
          elif echo "$PUBLISH_OUT" | grep -Eq "E409|previously staged|previously published"; then
            PUBLISH_OUTCOME="already-staged"
            echo "Notice: ${TARGET_SPEC} is already staged or published on npm (E409 conflict). Proceeding to verify registry propagation..."
          else
            echo "::error::npm publish failed with exit code $PUBLISH_EXIT"
            exit $PUBLISH_EXIT
          fi
          PUBLISH_ACCEPTED_EPOCH="$(date +%s)"
          PUBLISH_ACCEPTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Verifying that ${TARGET_SPEC} is live on npm registry..."
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          REQUEST_TIMEOUT_SECONDS=5
          MAX_WAIT_SECONDS=$((MAX_ATTEMPTS * REQUEST_TIMEOUT_SECONDS + (MAX_ATTEMPTS - 1) * SLEEP_SECONDS))
          AVAILABLE=false
          REGISTRY_VISIBLE_EPOCH=""
          REGISTRY_VISIBLE_AT=""

          for i in $(seq 1 $MAX_ATTEMPTS); do
            OBSERVED_JSON="$(npm view "${TARGET_SPEC}" version gitHead --json --fetch-retries=0 --fetch-timeout=$((REQUEST_TIMEOUT_SECONDS * 1000)) 2>/dev/null || true)"
            OBSERVED_VERSION="$(jq -r 'if type == "array" then .[0].version // empty else .version // empty end' <<<"$OBSERVED_JSON" 2>/dev/null || true)"
            OBSERVED_GIT_HEAD="$(jq -r 'if type == "array" then .[0].gitHead // empty else .gitHead // empty end' <<<"$OBSERVED_JSON" 2>/dev/null || true)"
            if [[ "$OBSERVED_VERSION" == "$VERSION" && ( "$VERSION" != 3.* || "$OBSERVED_GIT_HEAD" == "${{ steps.source.outputs.commit }}" ) ]]; then
              AVAILABLE=true
              REGISTRY_VISIBLE_EPOCH="$(date +%s)"
              REGISTRY_VISIBLE_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Successfully verified ${TARGET_SPEC} on npm registry (attempt $i/$MAX_ATTEMPTS)!"
              break
            fi
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "Package not yet queryable on npm (attempt $i/$MAX_ATTEMPTS). Waiting ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
            fi
          done

          if [ "$AVAILABLE" != "true" ]; then
            echo "::error::Package ${TARGET_SPEC} was submitted but did not become available on npm registry within ${MAX_WAIT_SECONDS}s maximum probe budget."
            exit 1
          fi

          PROPAGATION_SECONDS=$((REGISTRY_VISIBLE_EPOCH - PUBLISH_ACCEPTED_EPOCH))
          echo "npm registry propagation: ${PROPAGATION_SECONDS}s (${PUBLISH_ACCEPTED_AT} -> ${REGISTRY_VISIBLE_AT}, ${i} probe(s))."
          {
            echo "### npm publication verification"
            echo "- Target: \`${TARGET_SPEC}\`"
            echo "- Publish result: \`${PUBLISH_OUTCOME}\`"
            echo "- Publish started: \`${PUBLISH_STARTED_AT}\`"
            echo "- Publish accepted: \`${PUBLISH_ACCEPTED_AT}\`"
            echo "- Registry visible: \`${REGISTRY_VISIBLE_AT}\`"
            echo "- Propagation: \`${PROPAGATION_SECONDS}s\`"
            echo "- Verification probes: \`${i}/${MAX_ATTEMPTS}\`"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
