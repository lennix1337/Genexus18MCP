name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: 8.0.x

      - name: Cache VS Code test runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/nexus-ide/.vscode-test
          key: nexus-ide-vscode-${{ runner.os }}-1.111.0
          restore-keys: |
            nexus-ide-vscode-${{ runner.os }}-

      - name: Install npm deps
        run: npm install

      - name: CLI tests
        run: npm test

      - name: Root lint
        run: npm run lint

      - name: Validate quality gate manifests and scripts
        shell: pwsh
        run: |
          $scriptPaths = @(
            'scripts/pr-preflight.ps1',
            'scripts/pr-push.ps1',
            'scripts/test-live.ps1',
            'scripts/check-build-warning-baseline.ps1'
          )
          foreach ($path in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors in ${path}: $($errors -join '; ')"
            }
          }
          ./scripts/check-build-warning-baseline.ps1 -ValidateOnly
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/bench-live-http.py').read_text(encoding='utf-8')); print('benchmark-python: valid')"

      - name: Install Nexus IDE deps
        working-directory: src/nexus-ide
        run: npm ci

      - name: Nexus IDE compile
        working-directory: src/nexus-ide
        run: npm run compile

      - name: Nexus IDE lint
        working-directory: src/nexus-ide
        run: npm run lint

      - name: Nexus IDE tests
        working-directory: src/nexus-ide
        run: npm test

      - name: Gateway and Worker coverage
        shell: pwsh
        run: |
          ./scripts/coverage/collect.ps1 -OutputRoot "$env:RUNNER_TEMP\gx-coverage-artifacts"
          ./scripts/coverage/assert-threshold.ps1 -CoverageRoot "$env:RUNNER_TEMP\gx-coverage-artifacts" -MinLineRatePercent 60

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gateway-worker-coverage
          path: ${{ runner.temp }}\gx-coverage-artifacts

      - name: LLM contract smoke
        shell: pwsh
        run: ./scripts/mcp_llm_contract_smoke.ps1

      # Contract test: the gateway builds without the GeneXus SDK (net8.0-windows, no
      # Artech refs), so this runs on CI. It launches a real gateway in-process and runs
      # scripts/mcp_smoke.ps1 unmodified against it — pinning first-party diagnostic
      # scripts to the gateway's HTTP protocol contract (the v2.38.0-v2.45.1 406 drift).
      - name: MCP smoke script contract test
        run: >
          dotnet test src/GxMcp.Gateway.Tests/GxMcp.Gateway.Tests.csproj
          --filter "FullyQualifiedName~McpSmokeScriptContract"
