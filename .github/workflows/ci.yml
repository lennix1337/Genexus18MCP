name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Keep required check names stable; each PR update has one validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The work below used to be one job with 26 sequential steps on a single
# runner, which cost ~13.5 minutes. None of those steps depend on each other, so
# they are split across lanes that run at the same time.
#
# `test` is deliberately kept as a job name. Branch protection requires a check
# context called exactly `test`; renaming the work to `test (dotnet)` or folding
# it into a matrix would leave that context unmatched and block every merge. So
# the lanes fan out under their own names and `test` stays as the gate that
# depends on all of them (scripts/ci/assert-ci-gate.ps1) and asserts what a single
# lane cannot judge: the coverage threshold over the reports the lanes produced
# and, for Engine.Backend routing/default changes, passing SDK/live evidence.
#
# A lane is only worth its own runner if it is heavy enough to absorb the ~100s
# of Checkout + toolchain setup a hosted Windows runner charges per job. That is
# why the CLI and Nexus IDE lanes stay together rather than becoming five.
#
# The two .NET test projects are deliberately NOT split across runners. They were
# already isolated from each other, but a hosted runner has no GeneXus SDK, so
# collect.ps1 has always skipped Worker.Tests there and only Gateway coverage
# actually runs - assert-threshold.ps1 says so itself. A matrix would put the real
# work in one leg and a skip in the other, buying no wall clock and costing a
# second runner. Measured on the pre-change workflow: Worker line-rate: skipped
# (no local GeneXus 18 SDK; gateway threshold enforced only).
#
# Lanes a pull request's diff cannot affect are skipped. `changes` maps every
# changed path through scripts/ci/lane-paths.json (classify-lanes.ps1) and each
# skippable lane runs unless its output is exactly 'false'. Fails closed: a
# non-PR event, an unknown diff, an unmapped path or a CI-definition change runs
# every lane. contracts always runs (its line-ending check covers every file).
# The gate accepts a skipped lane only when `changes` said 'false' for it, and
# enforces the coverage threshold whenever the dotnet lane was required.
jobs:
  # Classifies the change once: which lanes it can affect, and whether the gate
  # must require SDK/live evidence for Engine.Backend routing/default changes.
  # Both classifiers fail closed when the diff cannot be determined. Ubuntu
  # because every lane waits on this job and a Linux runner starts sooner.
  changes:
    name: changes (lane + sdk evidence scope)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk_evidence_required: ${{ steps.classify.outputs.sdk_evidence_required }}
      run_dotnet: ${{ steps.lanes.outputs.run_dotnet }}
      run_toolchain: ${{ steps.lanes.outputs.run_toolchain }}
      run_rust: ${{ steps.lanes.outputs.run_rust }}
      run_rust_engine: ${{ steps.lanes.outputs.run_rust_engine }}
      lanes_reason: ${{ steps.lanes.outputs.lanes_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Classify Engine.Backend routing/default changes
        id: classify
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/classify-sdk-evidence.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

      - name: Classify which lanes the change can affect
        id: lanes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/classify-lanes.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

  dotnet:
    name: dotnet
    needs: [changes]
    if: ${{ needs.changes.outputs.run_dotnet != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Skip the 300 MB SDK download (~35s) when the image already has a 10.0 SDK.
      - name: Detect preinstalled .NET 10 SDK
        id: dotnet-sdk
        shell: pwsh
        run: |
          $sdks = if (Get-Command dotnet -ErrorAction SilentlyContinue) { @(dotnet --list-sdks) } else { @() }
          "present=$((@($sdks -match '^10\.0\.').Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        if: ${{ steps.dotnet-sdk.outputs.present != 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      # Restore and build outputs; MSBuild still recompiles changed source, so a stale
      # cache cannot mask an edit. No src/**/bin: builds go to .test-bin.
      - name: Cache NuGet packages and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            .test-bin
            src/**/obj
          key: dotnet-v2-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/*.runsettings') }}
          restore-keys: |
            dotnet-v2-${{ runner.os }}-

      # Without publish/gxwire.exe, collect.ps1 spends ~70s building it from cold.
      - name: Cache gxwire binary for Gateway tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: publish/gxwire.exe
          key: gxwire-exe-${{ runner.os }}-${{ hashFiles('src/gxwire/Cargo.lock', 'src/gxwire/Cargo.toml', 'src/gxwire/**/*.rs', 'src/gxwire/**/build.rs', '**/.cargo/config*') }}

      # Includes McpSmokeScriptContractTests (scripts/mcp_smoke.ps1 against a live
      # Gateway), pointed at the Gateway this run built rather than any stale copy.
      - name: Gateway and Worker coverage
        shell: pwsh
        env:
          GXMCP_LIVE_GATEWAY_EXE: ${{ github.workspace }}\.test-bin\gateway\Debug\net10.0-windows\GxMcp.Gateway.exe
        run: ./scripts/coverage/collect.ps1 -OutputRoot "$env:RUNNER_TEMP\gx-coverage-artifacts"

      # CI time budget: scripts/ci/test-time-budget.json.
      - name: Assert per-test time budget
        shell: pwsh
        run: ./scripts/ci/assert-test-durations.ps1 -TrxPath "$env:RUNNER_TEMP\gx-coverage-artifacts\gateway.trx"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-worker-coverage
          path: ${{ runner.temp }}\gx-coverage-artifacts

  toolchain:
    name: toolchain (cli + nexus-ide)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_toolchain != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/nexus-ide/package-lock.json

      - name: Cache VS Code test runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/nexus-ide/.vscode-test
          key: nexus-ide-vscode-${{ runner.os }}-1.111.0
          restore-keys: |
            nexus-ide-vscode-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci

      - name: CLI tests
        run: npm test

      - name: Root lint
        run: npm run lint

      - name: Install Nexus IDE deps
        working-directory: src/nexus-ide
        run: npm ci

      - name: Nexus IDE compile
        working-directory: src/nexus-ide
        run: npm run compile

      - name: Nexus IDE lint
        working-directory: src/nexus-ide
        run: npm run lint

      - name: Nexus IDE tests
        working-directory: src/nexus-ide
        run: npm test

      # The .vsix is a required release asset, but nothing in CI ran `vsce
      # package`, so a dependency bump could break packaging and land green
      # (issue #482: @types/vscode ^1.140.0 against engines.vscode ^1.93.0
      # compiles fine and only fails at package time). Packaging is validated
      # here, and the artifact is asserted rather than uploaded, so the release
      # stays the only place a .vsix is produced.
      - name: Nexus IDE package
        working-directory: src/nexus-ide
        run: npm run package

      - name: Verify Nexus IDE VSIX was produced
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath src/nexus-ide/package.json -Raw | ConvertFrom-Json).version
          $vsix = @(Get-ChildItem -LiteralPath src/nexus-ide -Filter '*.vsix' -File)
          if ($vsix.Count -ne 1) { throw "Expected exactly one .vsix, found $($vsix.Count): $($vsix.Name -join ', ')" }
          if ($vsix[0].Name -ne "nexus-ide-$expected.vsix") {
            throw "Packaged '$($vsix[0].Name)' but package.json version is '$expected'."
          }

  rust:
    name: rust (gxwire)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_rust != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Identify Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain is unavailable.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache gxwire dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src/gxwire/target
          key: gxwire-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src/gxwire/Cargo.lock', 'src/gxwire/Cargo.toml', 'src/gxwire/**/*.rs', 'src/gxwire/**/build.rs', '**/.cargo/config*') }}
          restore-keys: |
            gxwire-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      # One native command per step: a pwsh step's exit code is the last native command's, so
      # a failure followed by a success would pass. scripts/tests/test-ci-workflow-policy.ps1 enforces this.
      - name: Check gxwire formatting
        shell: pwsh
        run: cargo fmt --manifest-path src/gxwire/Cargo.toml --check

      - name: Lint gxwire
        shell: pwsh
        run: cargo clippy --manifest-path src/gxwire/Cargo.toml --all-targets --locked -- -D warnings

      # No release build here: the staged exe was never uploaded, and the release
      # workflow and build.ps1 build the shipped binary. The dotnet lane caches its own.
      - name: Test gxwire engine
        shell: pwsh
        run: cargo test --manifest-path src/gxwire/Cargo.toml --locked

  rust-engine:
    name: rust (gx-engine)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_rust_engine != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Identify Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain is unavailable.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache gx-engine dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src/gx-engine/target
          key: gx-engine-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src/gx-engine/Cargo.lock', 'src/gx-engine/Cargo.toml', 'src/gx-engine/**/*.rs', 'src/gx-engine/**/build.rs', '**/.cargo/config*') }}
          restore-keys: |
            gx-engine-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      # One native command per step: see the gxwire job.
      - name: Lint gx-engine
        shell: pwsh
        run: cargo clippy --manifest-path src/gx-engine/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check gx-engine formatting
        shell: pwsh
        run: cargo fmt --manifest-path src/gx-engine/Cargo.toml --check

      # cargo test runs the ~90 test binaries one after another (~230s, two of them
      # 61s and 47s); nextest runs every test in parallel across binaries. Its `ci`
      # profile (src/gx-engine/.config/nextest.toml) also fails any test that exceeds
      # the per-test time budget. No release build: the staged exe was never uploaded,
      # and the release workflow and build.ps1 build the shipped binary (~130s here).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146

      - name: Test gx-engine
        shell: pwsh
        run: cargo nextest run --manifest-path src/gx-engine/Cargo.toml --locked --profile ci

      # nextest does not run doctests (gx-engine has compile_fail ones).
      - name: Test gx-engine doctests
        shell: pwsh
        run: cargo test --doc --manifest-path src/gx-engine/Cargo.toml --locked

  contracts:
    name: contracts (python + docs)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Docs scope regression tests
        shell: pwsh
        run: ./scripts/tests/test-ci-docs-scope.ps1

      - name: Detect change scope
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:BASE_SHA -and $env:HEAD_SHA) {
            $changed = @(& git diff --name-only --no-renames "$env:BASE_SHA...$env:HEAD_SHA" 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "git diff failed; cannot determine docs-only scope: $($changed -join ' ')" }
            $nonDocs = @($changed | Where-Object { $_ -and $_ -notmatch '^(.*\.md|docs/.*|plans/.*|LICENSE)$' })
            if ($changed.Count -gt 0 -and $nonDocs.Count -eq 0) {
              Write-Host "Docs-only change ($($changed.Count) files) - skipping heavy script suites."
              "docs_only=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          "docs_only=false" >> $env:GITHUB_OUTPUT

      - name: Line endings
        shell: pwsh
        run: ./scripts/ci/check-line-endings.ps1

      - name: Documentation contract tests
        shell: pwsh
        run: node scripts/tests/docs.test.js

      - name: Verify release metadata synchronization
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          python scripts/verify-release-metadata.py --root . --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Release-facing metadata is out of sync. Run python scripts/sync-release-metadata.py --version <package-version> --write.' }

      - name: Validate quality gate manifests and scripts
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: pwsh
        run: |
          $scriptPaths = @(
            'scripts/pr-preflight.ps1',
            'scripts/pr-push.ps1',
            'scripts/install.ps1',
            'scripts/install-transaction.ps1',
            'scripts/test-live.ps1',
            'scripts/integration-preflight.ps1',
            'scripts/read-issue.ps1',
            'scripts/check-upstream-drift.ps1',
            'scripts/test-live-matrix.ps1',
            'scripts/check-build-warning-baseline.ps1'
          )
          foreach ($path in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors in ${path}: $($errors -join '; ')"
            }
          }
          ./scripts/check-build-warning-baseline.ps1 -ValidateOnly
          ./scripts/tests/test-upstream-drift.ps1
          ./scripts/tests/sdk-validation-contract.tests.ps1
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/bench-live-http.py').read_text(encoding='utf-8')); print('benchmark-python: valid')"
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark Python syntax validation failed.' }
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/validate-v3-plan.py').read_text(encoding='utf-8')); print('v3-plan-python: valid')"
          if ($LASTEXITCODE -ne 0) { throw 'v3 plan Python syntax validation failed.' }
          python scripts/validate-v3-evaluation.py
          if ($LASTEXITCODE -ne 0) { throw 'v3 evaluation corpus validation failed.' }
          python scripts/validate-v3-evaluation.py tests/agent-evals/corpus.json
          if ($LASTEXITCODE -ne 0) { throw 'v3 agent replay corpus validation failed.' }
          python scripts/validate-v3-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'v3 execution plan validation failed.' }
          python scripts/validate-tool-contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'tool contract validation failed.' }

      # Includes test-ci-workflow-policy, install-contract, test-live-matrix and
      # test-integration-preflight, which the step above used to run a second time.
      # The scripts run in parallel; each one is held to the per-script time budget.
      - name: Release script suite
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: pwsh
        run: ./scripts/tests/run-release-script-tests.ps1

      - name: Benchmark gate regression tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python from the Windows runner image is required.' }
          python -m unittest discover -s scripts/tests -p "test_bench_live_http.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark gate regression tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_v3_evaluation.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'v3 evaluation corpus tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_v3_plan.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'v3 execution plan tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_tool_contracts.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'tool contract tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_verify_release_manifest.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'release manifest verifier tests failed.' }

      - name: LLM contract smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: pwsh
        run: ./scripts/mcp_llm_contract_smoke.ps1

  # The required check. Every lane above must have passed, or been skipped because
  # `changes` classified it as unreachable from the diff; this job keeps the name
  # `test` on the merge gate. It runs when a lane fails (`!cancelled()`) because a job
  # skipped for a failed dependency would otherwise count as a passing required check.
  # The gate asserts every lane result, the SDK evidence an Engine.Backend routing or
  # default change requires, and the coverage threshold over both projects together.
  test:
    name: test
    # Linux: the gate only reads job results and a coverage XML, and it is the last
    # job on the critical path, where a Windows runner's slower start is paid in full.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() }}
    needs: [changes, dotnet, toolchain, rust, rust-engine, contracts, sdk-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Assert required lanes and SDK evidence
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SDK_EVIDENCE_REQUIRED: ${{ needs.changes.outputs.sdk_evidence_required }}
          SDK_ENABLED: ${{ vars.GXMCP_SDK_CI_ENABLED }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          ./scripts/ci/assert-ci-gate.ps1 -NeedsJson $env:NEEDS_JSON `
            -SdkEvidenceRequired $env:SDK_EVIDENCE_REQUIRED -SdkEnabled $env:SDK_ENABLED `
            -HeadRepository $env:HEAD_REPOSITORY

      # Skipped only when the classifier said the dotnet lane cannot be affected;
      # the step above has already refused a dotnet lane skipped for any other reason.
      - name: Download coverage artifacts
        if: ${{ needs.changes.outputs.run_dotnet != 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-worker-coverage
          path: ${{ runner.temp }}/gx-coverage-artifacts

      - name: Assert combined coverage threshold
        if: ${{ needs.changes.outputs.run_dotnet != 'false' }}
        shell: pwsh
        run: ./scripts/coverage/assert-threshold.ps1 -CoverageRoot "$env:RUNNER_TEMP/gx-coverage-artifacts" -MinLineRatePercent 60

  # Contract test: the gateway builds without the GeneXus SDK (net10.0-windows, no
  # Artech refs), so this runs on CI. It launches a real gateway in-process and runs
  # scripts/mcp_smoke.ps1 unmodified against it — pinning first-party diagnostic
  # scripts to the gateway's HTTP protocol contract (the v2.38.0-v2.45.1 406 drift).
  # Kept beside the coverage lanes rather than in `contracts` because it reuses the
  # Gateway test build they already produced; moving it would pay a cold rebuild.
  #
  # The licensed runner never executes fork code, and the job exists only while the
  # repository variable declares a registered runner; otherwise it would queue
  # indefinitely. An absent lane is never green: the gate requires `pass` for
  # Engine.Backend routing/default changes.
  sdk-validation:
    if: ${{ vars.GXMCP_SDK_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, gx-sdk-18]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      state: ${{ steps.status.outputs.state }}
      commit: ${{ steps.status.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      - name: Run protected SDK and live Worker validation
        shell: pwsh
        run: .\scripts\ci\sdk-validation.ps1 -OutputRoot "$env:RUNNER_TEMP\gxmcp-sdk-validation"

      - name: Publish SDK lane status and logs
        id: status
        if: always()
        shell: pwsh
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'gxmcp-sdk-validation\status.json'
          if (Test-Path -LiteralPath $status) {
            Get-Content -LiteralPath $status | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $parsed = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
            "state=$($parsed.state)" >> $env:GITHUB_OUTPUT
            "commit=$($parsed.commit)" >> $env:GITHUB_OUTPUT
          } else {
            "sdk-validation state=fail reason=status.json was not produced" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "state=fail" >> $env:GITHUB_OUTPUT
          }

      - name: Upload SDK validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
